function esc(s) {

  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {

  var m = String(iso || '').match(/(\d{4})-(\d{2})-(\d{2})/);

  if (!m) return '';

  '.spk-n1 .spk{padding:18px 14px}.spg,.spk-many .spg{gap:12px}.spg .spk,.spk-many .spg .spk,.spg .spk:first-child:nth-last-child(2),.spg .spk:first-child:nth-last-child(2)+.spk{flex:0 0 100%;min-width:0}',

  '.spk-many .spg .spk{flex-direction:row;text-align:left;padding:12px 14px;gap:14px}.spk-many .ph-img,.spk-many .ph{width:64px;height:64px;font-size:20px}',

  '.hero-spk.spk-n2,.hero-spk.spk-many{gap:18px 12px}.spk-n2 .hs,.spk-many .hs{width:calc(50% - 6px)}',

  '.spk-n2 .hs .ph-img,.spk-n2 .hs .ph,.spk-many .hs .ph-img,.spk-many .hs .ph{width:112px;height:112px;border-width:4px;font-size:34px}.spk-n2 .hs .n,.spk-many .hs .n{font-size:15.5px}}'

].join('\n');



var DEFAULT_BLOCKS = [

  { id: 'event', show: true }, { id: 'speaker', show: true }, { id: 'abstract', show: true }, { id: 'form', show: true }

];

var BLOCK_NAMES = { event: 'Thông tin sự kiện', speaker: 'Diễn giả', abstract: 'Bài tham luận', form: 'Thông tin đăng ký' };



function photoHtml(sp) {

  return sp.photo ? '<img class="ph-img" src="' + esc(sp.photo) + '" alt="' + esc(sp.name) + '">'

    : '<div class="ph">' + esc(initials(sp.name)) + '</div>';

}

function chip(icon, txt) { return '<div class="chip">' + icon + '<span>' + esc(txt) + '</span></div>'; }

function item(icon, k, v) {

  return v ? '<div class="it"><div class="ic">' + icon + '</div><div><div class="k">' + esc(k) + '</div><div class="v">' + esc(v) + '</div></div></div>' : '';

}

function spList(cfg) {

  return (cfg.speakers || []).filter(function (s) { return s.name || s.photo || s.talkTitle || s.abstract; });

}

 

function spShown(cfg) { return spList(cfg).filter(function (s) { return s.name || s.photo; }); }

function spCls(n) { return n <= 1 ? 'spk-n1' : n <= 3 ? 'spk-n2' : 'spk-many'; }



function heroHtml(cfg, tpl) {

  var ev = cfg.event || {}, L = cfg.layout || {};

   

  var h = '<header class="hero hero-t"><div class="wrap"><div class="hero-in">' +

    (L.logo ? '<img class="logo" src="' + esc(L.logo) + '" alt="">' : '') +

    (ev.type ? '<span class="tag">' + esc(ev.type) + '</span>' : '') +

    '<h1>' + esc(ev.title || 'Tên sự kiện') + '</h1><div class="orn"><i></i><b></b><i></i></div>' +

    '</div></div></header>';

  if (tpl === 'poster') {

    var sp = spShown(cfg);

    if (sp.length) {

      h += '<div class="wrap"><div class="hero-spk ' + spCls(sp.length) + '">' + sp.map(function (s) {

        return '<div class="hs">' + photoHtml(s) + '<div class="n">' + esc(s.name) + '</div><div class="a">' + esc(s.affiliation) + '</div></div>';

      }).join('') + '</div></div>';

    }

  }

  return h;

}



function blkEvent(cfg, st) {

  var ev = cfg.event || {}, r = cfg.reg || {};

  var cap = +r.capacity || 0;

  var seats = cap ? 'Tối đa ' + cap + ' chỗ' + (st && st.count ? ', còn ' + st.remaining + ' chỗ' : '') : '';

  var h = item(IC.clock, 'Thời gian', timeLine(ev)) + item(IC.pin, 'Địa điểm', ev.venue) +

    item(IC.users, 'Đối tượng tham dự', ev.audience) + item(IC.org, 'Đơn vị tổ chức', ev.organizer) +

    item(IC.alarm, 'Hạn đăng ký', r.deadline ? 'Trước ' + deadlineText(r.deadline) : '') +

    item(IC.ticket, 'Số lượng', seats);

  return '<section class="card" id="blk-event"><h2>Thông tin sự kiện</h2><div class="info">' + h + '</div>' +

    (ev.note ? '<div class="note">' + esc(ev.note).replace(/\n/g, '<br>') + '</div>' : '') + linksHtml(ev) + '</section>';

}



function blkSpeaker(cfg) {

  var sp = spShown(cfg);

  if (!sp.length) return '';

  var cards = sp.map(function (s) {

    return '<div class="spk">' + photoHtml(s) + '<div><div class="n">' + esc(s.name) + '</div>' +

      (s.affiliation ? '<div class="a">' + esc(s.affiliation) + '</div>' : '') + '</div></div>';

  }).join('');

  return '<section class="card ' + spCls(sp.length) + '" id="blk-speaker"><h2>' + (sp.length > 1 ? 'Các diễn giả' : 'Diễn giả') + '</h2>' +

    (sp.length > 1 ? '<div class="spg">' + cards + '</div>' : cards) + '</section>';

}



function blkAbstract(cfg) {

  var sp = spList(cfg).filter(function (s) { return s.talkTitle || s.abstract; });

  if (!sp.length) return '';

   

  var gon = sp.length >= 4 || (sp.length > 1 && spShown(cfg).length >= 4);

  return '<section class="card" id="blk-abstract"><h2>Bài tham luận</h2>' + sp.map(function (s) {

    var dau = (s.talkTitle ? '<div class="tt">' + esc(s.talkTitle) + '</div>' : '') + (s.name ? '<div class="by">' + esc(s.name) + '</div>' : '');

    var tt = s.abstract ? '<div class="lb">Tóm tắt</div><div class="abs">' + paras(s.abstract) + '</div>' : '';

    if (gon && tt) return '<details class="talk"><summary>' + dau + '<span class="more"></span></summary>' + tt + '</details>';

    return '<div class="talk">' + dau + tt + '</div>';

  }).join('') + '</section>';

}



function fieldHtml(f) {

  var id = 'f_' + f.key;

  var req = f.required ? '<span class="req">*</span>' : '';

  var help = f.help ? '<div class="help">' + esc(f.help) + '</div>' : '';

  var ph = f.placeholder ? ' placeholder="' + esc(f.placeholder) + '"' : '';

  var inp;

  if (f.type === 'radio' || f.type === 'checkbox') {

    var t = f.type;

    inp = '<div class="opts">' + (f.options || []).map(function (o, i) {

      return '<label class="opt"><input type="' + t + '" name="' + id + '" value="' + esc(o) + '"><span>' + esc(o) + '</span></label>';

    }).join('') + (f.other ? '<label class="opt"><input type="' + t + '" name="' + id + '" value="__other"><span>Khác:</span>' +

      '<input class="oth" type="text" data-other="' + esc(f.key) + '" aria-label="Khác"></label>' : '') + '</div>';

  } else if (f.type === 'select') {

    inp = '<select class="inp" id="' + id + '" name="' + id + '"><option value="">Chọn...</option>' +

      (f.options || []).map(function (o) { return '<option>' + esc(o) + '</option>'; }).join('') + '</select>';

  } else if (f.type === 'textarea') {

    inp = '<textarea class="inp" id="' + id + '" name="' + id + '" rows="3"' + ph + '></textarea>';

  } else {

    var ty = { email: 'email', tel: 'tel', number: 'number', date: 'date' }[f.type] || 'text';

    var extra = f.type === 'tel' ? ' inputmode="tel" autocomplete="tel"' : f.type === 'email' ? ' autocomplete="email"' : '';

    inp = '<input class="inp" type="' + ty + '" id="' + id + '" name="' + id + '"' + ph + extra + '>';

  }

  return '<div class="fld" data-key="' + esc(f.key) + '" data-type="' + esc(f.type) + '" data-req="' + (f.required ? 1 : 0) + '">' +

    '<label class="lbl" for="' + id + '">' + esc(f.label) + req + '</label>' + help + inp + '<div class="err"></div></div>';

}



function seatsInner(cap, st) {

  if (st.pending) return IC.ticket + '<span>Tối đa <b>' + cap + '</b> chỗ</span>';

  var pct = Math.min(100, Math.round((st.count || 0) * 100 / cap));

  return IC.ticket + '<span>Còn <b>' + st.remaining + '</b>/' + cap + ' chỗ</span><div class="bar"><i style="width:' + Math.max(pct, 2) + '%"></i></div>';

}



function blkForm(cfg, st, opt) {

  var r = cfg.reg || {};

  var cap = +r.capacity || 0;

  st = st || { open: true, count: 0, remaining: cap };

  var seats = cap ? '<div class="seats" id="seats">' + seatsInner(cap, st) + '</div>' : '';

  var dl = r.deadline ? '<div class="dl">Hạn đăng ký: trước <b>' + esc(deadlineText(r.deadline)) + '</b></div>' : '';

  var head = '<section class="card" id="blk-form"><h2>Đăng ký tham dự</h2>';

  if (!st.open) {

    return head + seats + '<div class="closed"><div class="badge">' + IC.lock + '</div>' + esc(st.message || 'Đã đóng đăng ký.') + '</div></section>';

  }

  var wl = st.waitlist ? '<div class="note" style="margin:0 0 18px">Sự kiện đã đủ số lượng chính thức. Đăng ký mới sẽ được đưa vào danh sách dự bị.</div>' : '';

  var pv = !!(opt && opt.preview);

  var btn = '<button class="btn" type="' + (pv ? 'button' : 'submit') + '" id="btnSubmit">Gửi đăng ký</button>';

  var pages = formPagerSplit(cfg.fields || []);

  if (pages.length <= 1) {

    return head + seats + dl + wl + '<form id="regForm" novalidate>' + (cfg.fields || []).map(fieldHtml).join('') +

      '<div class="fmsg" id="fmsg"></div>' + btn + '</form></section>';

  }

   

  var n = pages.length;

  var body = pages.map(function (p, i) {

    return '<div class="fpage' + (pv || i === 0 ? ' on' : '') + '" data-pg="' + i + '">' +

      (pv ? '<div class="fnav fnav-pv">Trang ' + (i + 1) + '/' + n + '</div>' : '') + p.map(fieldHtml).join('') + '</div>';

  }).join('');

  var nav = pv ? '' : '<div class="fnav"><button class="fpb off" type="button" data-go="-1">' + SVG + '<path d="M15 18l-6-6 6-6"/></svg><span>Trang trước</span></button>' +

    '<span class="fpi" aria-live="polite">Trang 1/' + n + '</span>' +

    '<button class="fpb" type="button" data-go="1"><span>Trang sau</span>' + SVG + '<path d="M9 18l6-6-6-6"/></svg></button></div>';

  if (!pv) btn = btn.replace('<button ', '<button style="display:none" ');

  return head + seats + dl + wl + '<form id="regForm" novalidate>' + body +

    '<div class="fmsg" id="fmsg"></div>' + nav + btn + '</form></section>';

}



 

function formPagerSplit(fields, size) {

  size = size || 10;

  var out = [];

  for (var i = 0; i < fields.length; i += size) out.push(fields.slice(i, i + size));

  return out;

}



function footHtml(cfg, opt) {

  var ev = cfg.event || {};

  var a = [];

  if (FOOTER_NAME) a.push('<b>' + esc(FOOTER_NAME) + '</b>');

  if (ev.contact) a.push('Liên hệ: ' + esc(ev.contact));

  if (!opt || !opt.preview) a.push('<span id="adminLink"></span>');

  return a.length ? '<footer class="ft">' + a.join('<br>') + '</footer>' : '';

}



function renderPage(cfg, st, opt) {

  opt = opt || {};

  var L = cfg.layout || {};

  var tpl = L.template || 'banner';

   

  if (tpl === 'poster' && !spShown(cfg).length) tpl = 'banner';

  var blocks = (L.blocks && L.blocks.length ? L.blocks : DEFAULT_BLOCKS).filter(function (b) {

    if (b.id === 'form') return true;

    if (tpl === 'poster' && b.id === 'speaker') return false;

    return b.show;

  });

  var parts = { event: blkEvent(cfg, st), speaker: blkSpeaker(cfg), abstract: blkAbstract(cfg), form: blkForm(cfg, st, opt) };

  var body;

  if (tpl === 'twocol') {

    body = '<div class="grid2"><div class="col-main">' + blocks.filter(function (b) { return b.id !== 'form'; })

      .map(function (b) { return parts[b.id]; }).join('') + '</div><div class="col-side">' + parts.form + '</div></div>';

  } else {

    body = blocks.map(function (b) { return parts[b.id]; }).join('');

  }

  return '<div class="pg tpl-' + tpl + '" style="' + themeVars(L.color) + '">' + heroHtml(cfg, tpl) +

    '<main class="wrap">' + body + '</main>' + footHtml(cfg, opt) + '</div>';

}



function addStyle(css) {

  var s = document.createElement('style');

  s.textContent = css;

  document.head.appendChild(s);

}

</script>



<script>




function bootPublic() {

  addStyle(PAGE_CSS);

  var app = document.getElementById('app');

  if (BOOT.error) {

    app.innerHTML = '<div class="pg" style="' + themeVars() + '"><main class="wrap" style="padding-top:60px"><section class="card">' +

      '<div class="closed"><div class="badge">' + IC.info + '</div>' + esc(BOOT.error) + '</div></section></main></div>';

    return;

  }

  var cfg = BOOT.cfg;

  app.innerHTML = renderPage(cfg, BOOT.state, {});

  bindForm(cfg, sendGas);

  showAdminLink();

}





function showAdminLink() {}



function sendGas(id, ans) {

  return new Promise(function (res, rej) {

    google.script.run.withSuccessHandler(res).withFailureHandler(rej).submitRegistration(id, ans);

  });

}



function closeForm(message) {

  var b = document.getElementById('blk-form');

  if (b) b.innerHTML = '<h2>Đăng ký tham dự</h2><div class="closed"><div class="badge">' + IC.lock + '</div>' + esc(message) + '</div>';

}



function bindForm(cfg, send) {

  var form = document.getElementById('regForm');

  if (!form) return;

  form.addEventListener('change', function (e) {

    var t = e.target;

    if (t.type === 'radio' || t.type === 'checkbox') {

      var fld = t.closest('.fld');

      fld.querySelectorAll('.opt').forEach(function (o) { o.classList.toggle('on', o.querySelector('input').checked); });

      if (t.value === '__other' && t.checked) { var o = fld.querySelector('.oth'); if (o) o.focus(); }

      fld.classList.remove('bad');

      tatMsgNeuHetLoi();

    }

  });

  form.addEventListener('input', function (e) {

    form.setAttribute('data-touched', '1');

    var fld = e.target.closest('.fld');

    if (fld) { fld.classList.remove('bad'); tatMsgNeuHetLoi(); }

    if (e.target.classList.contains('oth') && e.target.value) {

      var r = e.target.parentNode.querySelector('input[value="__other"]');

      if (r && !r.checked) { r.checked = true; r.dispatchEvent(new Event('change', { bubbles: true })); }

    }

  });

   

  function tatMsgNeuHetLoi() {

    var m = document.getElementById('fmsg');

    if (m && m.classList.contains('on') && m.getAttribute('data-k') === 'fld' && !form.querySelector('.fld.bad')) m.classList.remove('on');

  }

  var pager = formPagerInit(form);

  form.addEventListener('submit', function (e) {

    e.preventDefault();

     

    if (pager && !pager.isLast()) return pager.next();

    var res = collect(form);

    showErrors(form, res.errors);

    var msg = document.getElementById('fmsg');

    if (Object.keys(res.errors).length) {

      msg.textContent = 'Quý Thầy/Cô vui lòng kiểm tra lại các ô được đánh dấu.';

      msg.setAttribute('data-k', 'fld');

      msg.classList.add('on');

      formPagerFocusBad(form, pager);

      return;

    }

    msg.classList.remove('on');

    var btn = document.getElementById('btnSubmit');

    btn.disabled = true;

    btn.textContent = 'Đang gửi...';

    send(cfg.id, res.ans).then(function (r) {

      btn.disabled = false;

      btn.textContent = 'Gửi đăng ký';

      r = r || {};

      if (r.ok) return showDone(cfg, r);

      if (r.closed) return closeForm(r.msg);

      if (r.errors) showErrors(form, r.errors);

      msg.textContent = r.msg || 'Chưa gửi được, Quý Thầy/Cô vui lòng thử lại.';

      msg.setAttribute('data-k', r.errors ? 'fld' : '');

      msg.classList.add('on');

       

      if (r.errors) formPagerFocusBad(form, pager);

    }, function (err) {

      btn.disabled = false;

      btn.textContent = 'Gửi đăng ký';

      msg.textContent = 'Chưa gửi được do lỗi kết nối. Quý Thầy/Cô vui lòng bấm gửi lại. (' + (err && err.message || err) + ')';

      msg.setAttribute('data-k', '');

      msg.classList.add('on');

    });

  });

}



 

function formPagerInit(form) {

  var pages = form.querySelectorAll('.fpage');

  if (pages.length < 2) return null;

  var cur = 0, n = pages.length;

  var nav = form.querySelector('.fnav');

  var prevB = nav.querySelector('[data-go="-1"]'), nextB = nav.querySelector('[data-go="1"]');

  var ind = nav.querySelector('.fpi'), btn = document.getElementById('btnSubmit');

  var msg = document.getElementById('fmsg');

  function go(i, scroll) {

    cur = Math.max(0, Math.min(n - 1, i));

    for (var k = 0; k < n; k++) pages[k].classList.toggle('on', k === cur);

    ind.textContent = 'Trang ' + (cur + 1) + '/' + n;

    prevB.classList.toggle('off', cur === 0);

    nextB.classList.toggle('off', cur === n - 1);

    btn.style.display = cur === n - 1 ? '' : 'none';

    if (scroll) { var b = document.getElementById('blk-form'); if (b) b.scrollIntoView({ behavior: 'smooth', block: 'start' }); }

  }

  function next() {

     

    var res = collect(pages[cur]);

    showErrors(pages[cur], res.errors);

    if (Object.keys(res.errors).length) {

      msg.textContent = 'Quý Thầy/Cô vui lòng kiểm tra lại các ô được đánh dấu trước khi sang trang.';

      msg.setAttribute('data-k', 'fld');

      msg.classList.add('on');

      var first = pages[cur].querySelector('.fld.bad');

      if (first) first.scrollIntoView({ behavior: 'smooth', block: 'center' });

      return;

    }

    msg.classList.remove('on');

    go(cur + 1, true);

  }

  prevB.addEventListener('click', function () { msg.classList.remove('on'); go(cur - 1, true); });

  nextB.addEventListener('click', next);

  go(0, false);

  return {

    next: next,

    go: go,

    isLast: function () { return cur === n - 1; },

    pageOf: function (el) { var p = el.closest('.fpage'); return p ? +p.getAttribute('data-pg') : cur; }

  };

}



 

function formPagerFocusBad(form, pager) {

  var first = form.querySelector('.fld.bad');

  if (!first) return;

  if (pager) pager.go(pager.pageOf(first), false);

  first.scrollIntoView({ behavior: 'smooth', block: 'center' });

}



var EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;

var PHONE_RE = /^(0|\+84)\d{8,11}$/;



function collect(form) {

  var ans = {}, errors = {};

  form.querySelectorAll('.fld').forEach(function (fld) {

    var key = fld.getAttribute('data-key'), type = fld.getAttribute('data-type'), req = fld.getAttribute('data-req') === '1';

    var v;

    if (type === 'radio' || type === 'checkbox') {

      var vals = [];

      fld.querySelectorAll('input[type=' + type + ']:checked').forEach(function (i) {

        if (i.value === '__other') {

          var o = fld.querySelector('.oth').value.trim();

          if (o) vals.push(o); else errors[key] = 'Vui lòng ghi rõ nội dung mục Khác.';

        } else vals.push(i.value);

      });

      v = type === 'checkbox' ? vals : (vals[0] || '');

      if (req && !vals.length && !errors[key]) errors[key] = 'Vui lòng chọn một mục.';

    } else {

      v = fld.querySelector('.inp').value.trim();

      if (req && !v) errors[key] = 'Vui lòng điền thông tin này.';

      else if (v && type === 'email' && !EMAIL_RE.test(v)) errors[key] = 'Email chưa đúng định dạng.';

      else if (v && type === 'tel' && !PHONE_RE.test(v.replace(/[\s.\-]/g, ''))) errors[key] = 'Số điện thoại chưa đúng, ví dụ 0909123456.';

    }

    ans[key] = v;

  });

  return { ans: ans, errors: errors };

}



function showErrors(form, errors) {

  form.querySelectorAll('.fld').forEach(function (fld) {

    var k = fld.getAttribute('data-key');

    fld.classList.toggle('bad', !!errors[k]);

    fld.querySelector('.err').textContent = errors[k] || '';

  });

}



function showDone(cfg, r) {

  var b = document.getElementById('blk-form');

  var extra = cfg.reg && cfg.reg.successMsg ? '<p>' + esc(cfg.reg.successMsg) + '</p>' : '';

  b.innerHTML = '<h2>Đăng ký tham dự</h2><div class="done"><div class="badge">' + IC.check + '</div>' +

    '<h3>' + (r.waitlist ? 'Đã ghi nhận vào danh sách dự bị' : 'Đăng ký thành công') + '</h3>' +

    (r.waitlist ? '<p>Sự kiện đã đủ số lượng chính thức. Ban tổ chức sẽ thông báo nếu có chỗ trống.</p>'

      : '<div class="stt">Số thứ tự: ' + r.stt + '</div>') +

    (r.emailSent ? '<p>Email xác nhận đã được gửi đến địa chỉ Quý Thầy/Cô đã khai báo.</p>' : '') + extra +

    '<p>Trân trọng cảm ơn Quý Thầy/Cô.</p></div>';

  b.scrollIntoView({ behavior: 'smooth', block: 'start' });

}

</script>



<script>




var SITE = MODE === 'site' ? BOOT : {};





function getJson(url, ms) {

  var ctl = typeof AbortController !== 'undefined' ? new AbortController() : null;

  var t = setTimeout(function () { if (ctl) ctl.abort(); }, ms || 15000);

  return fetch(url, ctl ? { signal: ctl.signal } : {}).then(function (r) {

    clearTimeout(t);

    if (!r.ok) throw new Error('HTTP ' + r.status);

    return r.json();

  }, function (e) { clearTimeout(t); throw e; });

}



function sendSite(id, ans) {

  if (!SITE.api) return Promise.reject(new Error('Website chưa được nối với máy chủ đăng ký.'));

  return fetch(SITE.api, {

    method: 'POST',

    headers: { 'Content-Type': 'text/plain;charset=utf-8' },

    body: JSON.stringify({ action: 'submit', id: id, ans: ans })

  }).then(function (r) {

    if (!r.ok) throw new Error('HTTP ' + r.status);

    return r.json();

  });

}



function siteMsg(html) {

  document.getElementById('app').innerHTML = '<div class="pg" style="' + themeVars() + '"><main class="wrap" style="padding-top:60px">' +

    '<section class="card"><div class="closed"><div class="badge">' + IC.info + '</div>' + html +

    '</div></section></main></div>';

}



function siteLoading() {

  document.getElementById('app').innerHTML = '<div class="ld"><div class="sp"></div><div>Đang tải thông tin sự kiện...</div></div>';

}



function pendingState(cfg) {

  var cap = +(cfg.reg && cfg.reg.capacity) || 0;

  return { open: true, count: 0, remaining: cap, capacity: cap, pending: true };

}



var SITE_CUR = null;

function siteShow(cfg, st) {

  SITE_CUR = cfg;

  document.title = 'Đăng ký: ' + (cfg.event && cfg.event.title || 'Sự kiện');

  document.getElementById('app').innerHTML = renderPage(cfg, st || pendingState(cfg), { site: true });

  bindForm(cfg, sendSite);

}



function siteApplyState(cfg, st) {

  var form = document.getElementById('regForm');

  var touched = form && form.getAttribute('data-touched');

  if (!touched) return siteShow(cfg, st);

  if (!st.open) return closeForm(st.message);

  var s = document.getElementById('seats');

  if (s && cfg.reg && cfg.reg.capacity) s.innerHTML = seatsInner(+cfg.reg.capacity, st);

}



function siteLive(id, fallbackMsg) {

  return getJson(SITE.api + '?api=event&e=' + encodeURIComponent(id), 25000).then(function (r) {

    if (!r || !r.ok) return siteMsg(esc((r && r.msg) || fallbackMsg));

    var form = document.getElementById('regForm');

    if (form && form.getAttribute('data-touched') && SITE_CUR) return siteApplyState(SITE_CUR, r.state);

    siteShow(r.cfg, r.state);

  });

}



function bootSite() {

  addStyle(PAGE_CSS);

  var q = new URLSearchParams(location.search);

  var id = String(q.get('e') || '').replace(/[^\w\-]/g, '');

  if (!id) return siteLanding();

  if (!SITE.api) return siteMsg('Trang đăng ký chưa được nối với máy chủ đăng ký.');

  siteLoading();

  

  siteLive(id, 'Không tìm thấy sự kiện này.').catch(function () {

    siteMsg('Chưa kết nối được máy chủ đăng ký. Quý Thầy/Cô vui lòng tải lại trang sau ít phút.');

  });

}



function siteLanding() {

  document.title = 'Đăng ký sự kiện';

  siteMsg('Quý Thầy/Cô vui lòng mở đường dẫn đăng ký của sự kiện được Ban tổ chức cung cấp.');

}

</script>


<script>

if (MODE === 'admin') bootAdmin();

else if (MODE === 'site') bootSite();

else bootPublic();

</script>
